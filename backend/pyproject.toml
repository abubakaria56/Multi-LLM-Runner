[project]
name = "multi-llm-runner-backend"
version = "0.1.0"
description = "FastAPI backend that runs one prompt across several LLMs concurrently and streams the results"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.1",
    "pydantic>=2.11.0",
    "tenacity>=9.1.0",
]
