[package]
name = "trade-distro-proto"
version = "0.1.0"
edition = "2024"

[features]
jsonschema = ["schemars"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
time = { version = "0.3", features = ["serde"] }

schemars = { version = "0.8", optional = true }
